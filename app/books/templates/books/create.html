<!-- app/books/templates/books/create.html -->
<!-- formulario para crear un libro con subida de imagen por arrastrar y soltar -->

{% extends "base.html" %}
{% block title %}Crear libro{% endblock %}
{% block content %}
<h2>crear libro</h2>

<!-- el atributo enctype="multipart/form-data" es obligatorio para subir archivos -->
<form method="post" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="titulo" class="form-label">Título *</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="isbn" class="form-label">ISBN *</label>
            <input type="text" class="form-control" id="isbn" name="isbn" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="precio" class="form-label">Precio *</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" required>
        </div>
        <div class="col-md-4 mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="stock" name="stock" value="0">
        </div>
        <div class="col-md-4 mb-3">
            <label for="imagen" class="form-label">Portada del libro</label>
            <!-- input tipo file: permite seleccionar o arrastrar una imagen -->
            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
            <!-- contenedor para la vista previa de la imagen seleccionada -->
            <div class="mt-2">
                <img id="preview" src="#" alt="vista previa" style="max-width: 200px; display: none;">
            </div>
        </div>
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripcion</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="categoria_id" class="form-label">Categoria *</label>
            <select class="form-select" id="categoria_id" name="categoria_id" required>
                <option value="">-- Selecciona --</option>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="autor_id" class="form-label">Autor *</label>
            <select class="form-select" id="autor_id" name="autor_id" required>
                <option value="">-- Selecciona --</option>
                {% for autor in autores %}
                    <option value="{{ autor.id }}">{{ autor.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="editorial_id" class="form-label">Editorial *</label>
            <select class="form-select" id="editorial_id" name="editorial_id" required>
                <option value="">-- Selecciona --</option>
                {% for editorial in editoriales %}
                    <option value="{{ editorial.id }}">{{ editorial.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('books.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}

{% block scripts %}
<!-- javascript para mostrar vista previa de la imagen antes de enviar -->
<script>
    // cuando cambie el campo de archivo (por seleccion o arrastrar)
    document.getElementById('imagen').addEventListener('change', function(e) {
        const preview = document.getElementById('preview');
        const archivo = e.target.files[0];  // primer archivo seleccionado
        if (archivo) {
            // leer el archivo como URL de datos para mostrarlo
            const reader = new FileReader();
            reader.onload = function(ev) {
                preview.src = ev.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(archivo);
        } else {
            // si se cancela, ocultar la vista previa
            preview.src = '#';
            preview.style.display = 'none';
        }
    });
</script>
{% endblock %}
