<!-- app/books/templates/books/edit.html -->
<!-- formulario para editar un libro con posibilidad de cambiar la imagen -->

{% extends "base.html" %}
{% block title %}Editar libro{% endblock %}
{% block content %}
<h2>Editar libro</h2>

<!-- igual que en create, necesita enctype para subir archivos -->
<form method="post" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="titulo" class="form-label">Titulo *</label>
            <input type="text" class="form-control" id="titulo" name="titulo" value="{{ libro.titulo }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="isbn" class="form-label">ISBN *</label>
            <input type="text" class="form-control" id="isbn" name="isbn" value="{{ libro.isbn }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="precio" class="form-label">Precio *</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ libro.precio }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="stock" name="stock" value="{{ libro.stock }}">
        </div>
        <div class="col-md-4 mb-3">
            <label for="imagen" class="form-label">Portada del libro</label>
            <!-- mostrar la imagen actual si existe -->
            {% if libro.imagen %}
                <div class="mb-2">
                    <img src="{{ url_for('static', filename='uploads/covers/' + libro.imagen) }}" alt="portada actual" style="max-width: 200px;">
                </div>
            {% endif %}
            <!-- input para cambiar la imagen (arrastrar o seleccionar) -->
            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
            <!-- vista previa de la nueva imagen -->
            <div class="mt-2">
                <img id="preview" src="#" alt="vista previa" style="max-width: 200px; display: none;">
            </div>
        </div>
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripcion</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ libro.descripcion or '' }}</textarea>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="categoria_id" class="form-label">Categoria *</label>
            <select class="form-select" id="categoria_id" name="categoria_id" required>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == libro.categoria_id %}selected{% endif %}>{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="autor_id" class="form-label">Autor *</label>
            <select class="form-select" id="autor_id" name="autor_id" required>
                {% for autor in autores %}
                    <option value="{{ autor.id }}" {% if autor.id == libro.autor_id %}selected{% endif %}>{{ autor.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="editorial_id" class="form-label">Editorial *</label>
            <select class="form-select" id="editorial_id" name="editorial_id" required>
                {% for editorial in editoriales %}
                    <option value="{{ editorial.id }}" {% if editorial.id == libro.editorial_id %}selected{% endif %}>{{ editorial.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Actualizar</button>
    <a href="{{ url_for('books.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}

{% block scripts %}
<!-- misma funcionalidad de vista previa que en create -->
<script>
    document.getElementById('imagen').addEventListener('change', function(e) {
        const preview = document.getElementById('preview');
        const archivo = e.target.files[0];
        if (archivo) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                preview.src = ev.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(archivo);
        } else {
            preview.src = '#';
            preview.style.display = 'none';
        }
    });
</script>
{% endblock %}
