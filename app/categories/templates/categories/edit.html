<!-- app/categories/templates/categories/edit.html -->
<!-- formulario para editar una categoria existente -->

{% extends "base.html" %}
{% block title %}Editar categoria{% endblock %}
{% block content %}
<h2>Editar categoria</h2>
<form method="post">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" class="form-control" id="nombre" name="nombre"
               value="{{ categoria.nombre }}" required maxlength="100">
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripcion</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ categoria.descripcion or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-success">Actualizar</button>
    <a href="{{ url_for('categories.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
