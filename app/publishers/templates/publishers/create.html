<!-- app/publishers/templates/publishers/create.html -->
{% extends "base.html" %}
{% block title %}crear editorial{% endblock %}
{% block content %}
<h2>crear editorial</h2>
<form method="post">
    <div class="mb-3">
        <label for="nombre" class="form-label">nombre *</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required maxlength="150">
    </div>
    <div class="mb-3">
        <label for="pais" class="form-label">pais</label>
        <input type="text" class="form-control" id="pais" name="pais" maxlength="100">
    </div>
    <div class="mb-3">
        <label for="telefono" class="form-label">telefono</label>
        <input type="text" class="form-control" id="telefono" name="telefono" maxlength="20">
    </div>
    <button type="submit" class="btn btn-success">guardar</button>
    <a href="{{ url_for('publishers.index') }}" class="btn btn-secondary">cancelar</a>
</form>
{% endblock %}
