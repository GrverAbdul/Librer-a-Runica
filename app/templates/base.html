<!-- app/templates/base.html -->
<!-- plantilla base con bootstrap 5, incluye navbar, mensajes flash y pie de pagina -->

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Libreria Rúnica{% endblock %}</title>
    <!-- bootstrap 5 css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- inclusion de la barra de navegacion -->
    {% include 'navbar.html' %}

    <!-- contenido principal -->
    <main class="container flex-grow-1 mt-4">
        <div class="bg-white p-4 rounded shadow-sm">
            <!-- inclusion de mensajes flash -->
            {% include 'flashes.html' %}
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- inclusion del pie de pagina -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 libreria runica. todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- bootstrap 5 js bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- archivos javascript propios -->
    {% block scripts %}{% endblock %}
</body>
</html>
